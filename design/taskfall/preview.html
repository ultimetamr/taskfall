<!doctype html>
<meta charset="utf-8">
<title>Taskfall design preview</title>
<style>
  :root{color-scheme:dark;font:16px system-ui;background:#161638;color:#f7f6ff}body{margin:0;padding:32px;background:radial-gradient(circle at 50% 0,#38326e,#161638 60%)}main{max-width:1100px;margin:auto}h1{font-size:38px;margin:0 0 8px}.sub{color:#c9c6e6}.field{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}.card,.basket,.editor{border:1px solid #5c5990;border-radius:24px;padding:20px;background:#242451cc;box-shadow:0 14px 40px #09091f80}.card{grid-column:1/3;min-height:120px;background:linear-gradient(135deg,#ff8b7f,#6b67d9);color:#141329}.card b{display:block;font-size:28px}.baskets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.basket{min-height:110px}.today{border-color:#ff8b7f}.later{border-color:#7ed9e7}.delegate{border-color:#b79cff}.undecided{border-color:#f4c96d}.label{font-weight:700}.count{font-size:32px;margin-top:14px}.editor{margin-top:16px}button{padding:12px 18px;border:0;border-radius:14px;background:#f7f6ff;color:#201d4b;font-weight:700}
</style>
<main><h1>Taskfall</h1><div class="sub">A calm spatial sort for the next 20 things.</div><section class="field"><div class="card"><b>整理项目提案</b><span>抓取并拖入一个篮筐</span></div><div class="baskets"><div class="basket today"><div class="label">◷ 今天</div><div class="count">4</div></div><div class="basket later"><div class="label">⌁ 以后</div><div class="count">7</div></div><div class="basket delegate"><div class="label">↗ 交给别人</div><div class="count">3</div></div><div class="basket undecided"><div class="label">? 待决定</div><div class="count">6</div></div></div></section><div class="editor"><div class="label">结果清单 · 可编辑 · 可截图导出</div><p>✓ 4 今天　→ 7 以后　↗ 3 交给别人　? 6 待决定</p><button>导出截图</button></div></main>
